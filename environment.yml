# Conda environment for the demand_propagation package (see README).
name: demand_propagation
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip  # installs this package with `pip install -e .`
  - numpy
  - pandas
  - pytest  # tests
  - ruff  # linting and formatting
  - pdoc  # builds the API documentation into docs/
  - jupyterlab  # runs demo_state_construction.ipynb
