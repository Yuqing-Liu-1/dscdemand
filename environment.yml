# Conda environment for dscdemand (see README).
name: dscdemand
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip  # installs the package with `pip install -e .`
  - make  # runs the Makefile commands (also on Windows)
  - numpy
  - pandas
  - scipy  # optimizer for estimation
  - pytest  # tests
  - ruff  # linting and formatting
  - pdoc  # builds the API documentation into docs/
  - jupyterlab  # runs demo.ipynb
