# Overview:
# - Purpose: Central configuration for Python tooling.
# - Used by: pip (packaging), pytest, and ruff.
# - Adds: Consistent tool behavior on every machine.
# - Learn more: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand_propagation"
version = "0.1.0"
description = "Reusable computational workflow for a dynamic cross-category demand propagation model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
]

[tool.setuptools.packages.find]
include = ["demand_propagation*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["demand_propagation/tests"]
