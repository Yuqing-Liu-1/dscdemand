[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dscdemand"
version = "0.1.0"
description = "Dynamic demand models for storable and complementary goods"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yuqing Liu" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[tool.setuptools.packages.find]
include = ["dscdemand*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["dscdemand/tests"]
